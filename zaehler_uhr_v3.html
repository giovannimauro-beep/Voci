
<!DOCTYPE html>
<html lang='de'>
<head>
<meta charset='UTF-8'>
<title>Zähler mit Uhr & Effekten</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 40px;
    background-color: #111;
    color: white;
    cursor: none;
    overflow: hidden;
  }
  #clock {
    font-size: 110px;
    padding: 20px 40px;
    border: 5px solid white;
    display: inline-block;
    margin-bottom: 40px;
  }
  #number {
    font-size: 100px;
    margin: 40px 0;
  }
  button {
    font-size: 30px;
    padding: 15px 30px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(#666, #333);
    color: white;
    box-shadow: 0 5px 0 #000;
    transition: 0.1s;
    cursor: pointer;
  }
  button:hover {
    background: linear-gradient(#777, #444);
  }
  button:active {
    box-shadow: 0 2px 0 #000;
    transform: translateY(3px);
  }
  #trail {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .dot {
    position: absolute;
    width: 15px; height: 15px;
    border-radius: 50%;
    opacity: 1;
    animation: fade 0.8s linear forwards;
  }
  @keyframes fade {
    to { opacity: 0; transform: scale(0.5); }
  }
</style>
</head>
<body>
  <div id='clock'>00:00:00</div><br>
  <button onclick='changeFont()'>Schriftart wechseln</button>
  <h1>Zähler</h1>
  <div id='number'>0</div>
  <button onclick='change(1)'>+1</button>
  <button onclick='change(-1)'>-1</button>

  <div id='trail'></div>

<script>
let value = 0;
let fonts = ['Arial','Courier New','Georgia','Times New Roman','Verdana','Trebuchet MS','Impact'];

function change(delta){
  value += delta;
  document.getElementById('number').textContent = value;
}
function updateClock(){
  const now = new Date();
  let h = String(now.getHours()).padStart(2,'0');
  let m = String(now.getMinutes()).padStart(2,'0');
  let s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
}
setInterval(updateClock,1000); updateClock();

function changeFont(){
  let f = fonts[Math.floor(Math.random()*fonts.length)];
  document.getElementById('clock').style.fontFamily = f;
}

// rainbow mouse trail
const colors = ['red','orange','yellow','lime','cyan','blue','magenta'];
window.addEventListener('mousemove', e => {
  let dot = document.createElement('div');
  dot.className = 'dot';
  dot.style.left = e.pageX + 'px';
  dot.style.top = e.pageY + 'px';
  dot.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
  document.getElementById('trail').appendChild(dot);

  setTimeout(()=>{ dot.remove(); },800);
});
</script>
</body>
</html>

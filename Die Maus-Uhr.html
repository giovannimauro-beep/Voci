<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Chewy&family=Fredoka:wght@600&family=Lobster&family=Pacifico&family=Titan+One&display=swap" rel="stylesheet">
<title>Die Maus-Uhr</title>
<style>
:root{--bg:#fff7d6;--dial:#ffffff;--ink:#1d1d2b;--accent:#e63946;--blue:#1d4ed8;--face:#ffd9a8;--box:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14142b;--dial:#262650;--ink:#f5f5ff;--accent:#ff6b78;--blue:#7aa2ff;--face:#ffd9a8;--box:#262650}}
:root[data-theme="dark"]{--bg:#14142b;--dial:#262650;--ink:#f5f5ff;--accent:#ff6b78;--blue:#7aa2ff;--face:#ffd9a8;--box:#262650}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg,#c2185b);color:#fff;font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;
display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;min-height:100vh}
svg{width:min(94vw,540px);height:auto;--ink:#1d1d2b;--dial:#fff}
.digital{background:var(--digbg,#fff);color:var(--dig,#111);border:6px solid var(--dig,#111);font-family:var(--font,'Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif);border-radius:28px;padding:6px 28px;
font-size:clamp(64px,18vw,130px);font-weight:900;letter-spacing:4px;line-height:1.1}
.digital small{font-size:.4em;color:inherit}
.lang{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.panel{background:#fff;color:#222;border-radius:24px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;width:min(94vw,540px);box-sizing:border-box;font-family:system-ui,sans-serif}
.panel[hidden]{display:none}
.row{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.row input[type=color]{width:56px;height:44px;border:3px solid #bbb;border-radius:12px;padding:0;background:none;cursor:pointer}
.row select{font-size:18px;padding:8px;border-radius:12px;border:3px solid #bbb;max-width:170px}
.rst{font:inherit;font-size:18px;font-weight:700;padding:8px 16px;border-radius:12px;border:3px solid #6d28d9;background:#fff;color:#6d28d9;cursor:pointer}
#hh{fill:var(--hh,#ffb3d9)}
#mm{fill:var(--mm,#c2185b)}
#ss{stroke:var(--ss,#8b5cf6);fill:var(--ss,#8b5cf6)}
#nums{stroke:var(--num,#6d28d9)}
#nums [fill="#6d28d9"]{fill:var(--num,#6d28d9)}
svg path[stroke-width="40"]{stroke:var(--rim,#6d28d9)}
svg ellipse[fill="url(#sg)"]{fill:var(--eye,url(#sg))}
svg circle[r="24"][fill="#e63946"]{fill:var(--nose,#e63946)}
svg path[fill="#e63946"]{fill:var(--mouth,#e63946)}
svg circle[fill="#ff9aa2"]{fill:var(--cheek,#ff9aa2)}
svg > text{fill:var(--txt,#ffc2e0);font-family:var(--font,'Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif)}
.lang button{font:inherit;font-size:clamp(20px,5vw,30px);font-weight:800;padding:8px 22px;border-radius:999px;border:4px solid #6d28d9;background:#fff;color:#6d28d9;cursor:pointer}
.lang button.on{background:#6d28d9;color:#fff}
</style>
</head>
<body>
<svg viewBox="-90 -90 580 580" role="img" aria-label="Orologio di Lucia Mauro">
  
  <defs><radialGradient id="hg" gradientUnits="userSpaceOnUse" cx="200" cy="200" r="250"><stop offset="0" stop-color="#ffffff"/><stop offset=".15" stop-color="#ffffff"/><stop offset="1" stop-color="#ffb8da"/></radialGradient><radialGradient id="sg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a9b1bc"/></radialGradient><path id="tl" d="M-58.5 130 C-68 60 -47.5 -25 35 -45 C79.7 -54.75 130.1 -54 163.7 -35.8"/><path id="tr" d="M236.3 -35.8 C269.9 -54 320.3 -54.75 365 -45 C447.5 -25 468 60 458.5 130"/><path id="dl" d="M-58.5 130 C-54.4 240 90 340 200 460"/><path id="dr" d="M200 460 C310 340 454 240 458.5 130"/></defs><path d="M200 10 C186.25 -50 103.75 -60 35 -45 C-47.5 -25 -68 60 -58.5 130 C-54.4 240 90 340 200 460 C310 340 454 240 458.5 130 C468 60 447.5 -25 365 -45 C296.25 -60 213.75 -50 200 10 Z" fill="url(#hg)" stroke="#6d28d9" stroke-width="40" stroke-linejoin="round"/><text font-family="'Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif" font-size="32" font-weight="900" fill="#ffc2e0" letter-spacing="1" text-anchor="end"><textPath href="#tl" startOffset="100%"><tspan dy="10" id="t1">Orologio di</tspan></textPath></text><text font-family="'Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif" font-size="32" font-weight="900" fill="#ffc2e0" letter-spacing="1"><textPath href="#tr" startOffset="0%"><tspan dy="10" id="t2">Lucia Mauro</tspan></textPath></text><text font-family="'Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif" font-size="30" font-weight="900" fill="#ffc2e0" letter-spacing="1" text-anchor="middle"><textPath href="#dl" startOffset="50%"><tspan dy="10" id="dl1"></tspan></textPath></text><text font-family="'Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif" font-size="30" font-weight="900" fill="#ffc2e0" letter-spacing="1" text-anchor="middle"><textPath href="#dr" startOffset="50%"><tspan dy="10" id="dr1"></tspan></textPath></text>
  <g id="nums" fill="none" stroke="#6d28d9" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"></g>
  
  
  <circle cx="100" cy="226" r="15" fill="#ff9aa2" opacity=".8"/><circle cx="300" cy="226" r="15" fill="#ff9aa2" opacity=".8"/><path d="M124 114 Q150 94 176 114" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/><path d="M224 114 Q250 94 276 114" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/><ellipse cx="150" cy="150" rx="26" ry="30" fill="url(#sg)" stroke="var(--ink)" stroke-width="4"/><ellipse cx="250" cy="150" rx="26" ry="30" fill="url(#sg)" stroke="var(--ink)" stroke-width="4"/><circle cx="154" cy="156" r="12" fill="#1d1d2b"/><circle cx="246" cy="156" r="12" fill="#1d1d2b"/><circle cx="158" cy="151" r="4" fill="#fff"/><circle cx="250" cy="151" r="4" fill="#fff"/><circle cx="200" cy="200" r="24" fill="#e63946" stroke="#1d1d2b" stroke-width="3"/><circle cx="192" cy="192" r="6" fill="#fff" opacity=".7"/><path d="M125 252 Q200 290 275 252 Q200 350 125 252 Z" fill="#e63946" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
  
  
  
  
  
  <g id="hh" fill="#ffb3d9" stroke="#1d1d2b" stroke-width="3" stroke-linejoin="round"><path d="M200 232 Q191 220 196 206 L204 206 Q209 220 200 232 Z"/><polygon points="191,208 197,172 197,140 203,140 203,172 209,208"/><polygon points="200,146 206,156 200,166 194,156"/><path d="M200 86 Q213 104 209 120 L191 120 Q187 104 200 86 Z"/><circle cx="200" cy="130" r="11"/><circle cx="200" cy="130" r="5" fill="var(--dial)"/></g>
  <g id="mm" fill="#c2185b" stroke="#1d1d2b" stroke-width="3" stroke-linejoin="round"><path d="M200 238 Q191 222 196 207 L204 207 Q209 222 200 238 Z"/><polygon points="192,208 197,172 197,115 203,115 203,172 208,208"/><polygon points="200,132 207,145 200,158 193,145"/><path d="M200 34 Q212 62 208 96 L192 96 Q188 62 200 34 Z"/><circle cx="200" cy="106" r="9"/><circle cx="200" cy="106" r="4" fill="var(--dial)"/></g>
  <g id="ss" stroke="#8b5cf6" fill="#8b5cf6"><line x1="200" y1="232" x2="200" y2="40" stroke-width="2.5" stroke-linecap="round"/><circle cx="200" cy="224" r="5" stroke="none"/><circle cx="200" cy="72" r="6" fill="none" stroke-width="2"/><polygon points="200,36 204,50 196,50" stroke="none"/></g><circle cx="200" cy="200" r="9" fill="#1d1d2b"/><circle cx="200" cy="200" r="3.5" fill="#8b5cf6"/>
</svg>
<div class="digital"><span id="dig">00:00</span> <small id="sec">00</small></div>
<div class="lang"><button id="bIt" type="button">Italiano</button><button id="bDe" type="button">Deutsch</button><button id="bSet" type="button"></button></div>
<div id="panel" class="panel" hidden></div>

<script>
var nums=document.getElementById('nums');
var V='#6d28d9',six='<path d="M18 5 C9 6 4 15 4 27"/><ellipse cx="12.5" cy="27" rx="7.5" ry="8.5" fill="'+V+'"/>';
var GL={'0':'<ellipse cx="12" cy="20" rx="8.5" ry="16" fill="'+V+'"/>','1':'<path d="M5 11 L14 4 L14 37"/>','2':'<path d="M4 11 C4 2 20 2 20 11 Z" fill="'+V+'"/><path d="M4 10 C4 2 20 2 20 10 C20 18 6 26 4 36 L21 36"/>','3':'<path d="M8 4 C16 1 20 5 20 10 C20 16 14 19 8 19 Z" fill="'+V+'"/><path d="M8 19 C16 19 21 22 21 28 C21 36 15 38 8 37 Z" fill="'+V+'"/><path d="M4 7 C7 2 20 2 20 10 C20 17 14 19 10 19 C15 19 21 21 21 28 C21 38 8 39 3 33"/>','4':'<polygon points="3,26 17,4 17,26" fill="'+V+'"/><path d="M17 37 L17 4 L3 26 L22 26"/>','5':'<path d="M7 18 C15 15 21 18 21 27 C21 36 14 38 7 36 Z" fill="'+V+'"/><path d="M20 4 L6 4 L5 19 C10 15 21 17 21 27 C21 37 8 39 3 33"/>','6':six,'7':'<path d="M3 5 L21 5 L10 37"/>','8':'<ellipse cx="12" cy="11" rx="6.5" ry="6.5" fill="'+V+'"/><ellipse cx="12" cy="28" rx="8" ry="8" fill="'+V+'"/>','9':'<g transform="rotate(180 12.5 21)">'+six+'</g>'};
for(var i=1;i<=12;i++){var a=i*30*Math.PI/180,t=document.createElementNS('http://www.w3.org/2000/svg','g');
var s=''+i,W=s.length*26-2,cx=200+Math.sin(a)*135,cy=200-Math.cos(a)*135,h='';for(var k=0;k<s.length;k++)h+='<g transform="translate('+(k*26)+' 0)">'+GL[s[k]]+'</g>';t.setAttribute('transform','translate('+cx+' '+cy+') scale(.8) translate('+(-W/2)+' -20)');t.innerHTML=h;nums.appendChild(t);}
var L={it:{tage:['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'],mon:['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'],t1:'Orologio di',t2:'Lucia Mauro',fmt:function(d,m,y){return d+' '+m+' '+y}},de:{tage:['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'],mon:['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],t1:'Uhr von',t2:'Lucia Mauro',fmt:function(d,m,y){return d+'. '+m+' '+y}}};var lang='it';
function setLang(l){lang=l;var Lg=L[l];document.getElementById('t1').textContent=Lg.t1;document.getElementById('t2').textContent=Lg.t2;document.documentElement.lang=l;document.getElementById('bIt').className=l=='it'?'on':'';document.getElementById('bDe').className=l=='de'?'on':'';try{localStorage.setItem('lang',l)}catch(e){}if(window.uiLabels)uiLabels();}
document.getElementById('bIt').onclick=function(){setLang('it')};
document.getElementById('bDe').onclick=function(){setLang('de')};
var ITEMS=[['bg','Hintergrund','Sfondo','#c2185b'],['rim','Herzrand','Bordo del cuore','#6d28d9'],['hc','Herz Mitte','Centro del cuore','#ffffff'],['he','Herz aussen','Esterno del cuore','#ffb8da'],['num','Zahlen','Numeri','#6d28d9'],['hh','Stundenzeiger','Lancetta delle ore','#ffb3d9'],['mm','Minutenzeiger','Lancetta dei minuti','#c2185b'],['ss','Sekundenzeiger','Lancetta dei secondi','#8b5cf6'],['eye','Augen','Occhi','#c9d0d8'],['nose','Nase','Naso','#e63946'],['mouth','Mund','Bocca','#e63946'],['cheek','Wangen','Guance','#ff9aa2'],['txt','Beschriftung','Scritta','#ffc2e0'],['dig','Digitalzahlen','Numeri digitali','#111111'],['digbg','Digital-Hintergrund','Sfondo digitale','#ffffff']];
var FONTS=[['Comic (Standard)',"'Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif"],['Fredoka',"'Fredoka','Trebuchet MS',sans-serif"],['Baloo 2',"'Baloo 2','Trebuchet MS',sans-serif"],['Chewy',"'Chewy','Comic Sans MS',sans-serif"],['Titan One',"'Titan One','Arial Black',sans-serif"],['Lobster',"'Lobster',Georgia,serif"],['Pacifico',"'Pacifico','Brush Script MT',cursive"],['Trebuchet',"'Trebuchet MS',Arial,sans-serif"],['Georgia',"Georgia,'Times New Roman',serif"],['Courier',"'Courier New',monospace"]];
var saved={};try{saved=JSON.parse(localStorage.getItem('mausuhr')||'{}')}catch(e){}
function save(){try{localStorage.setItem('mausuhr',JSON.stringify(saved))}catch(e){}}
var RT=document.documentElement.style;
function applyC(id,v){var st=document.querySelectorAll('#hg stop');if(id=='hc'){st[0].setAttribute('stop-color',v);st[1].setAttribute('stop-color',v)}else if(id=='he'){st[2].setAttribute('stop-color',v)}else RT.setProperty('--'+id,v)}
var panel=document.getElementById('panel'),bs=document.getElementById('bSet'),rows=[];
ITEMS.forEach(function(it){var lab=document.createElement('label');lab.className='row';var inp=document.createElement('input');inp.type='color';inp.value=saved[it[0]]||it[3];var sp=document.createElement('span');lab.appendChild(inp);lab.appendChild(sp);panel.appendChild(lab);rows.push(sp);it.push(inp);if(saved[it[0]])applyC(it[0],saved[it[0]]);inp.addEventListener('input',function(){saved[it[0]]=inp.value;applyC(it[0],inp.value);save()})});
var fl=document.createElement('label');fl.className='row';var fs=document.createElement('select');FONTS.forEach(function(f){var o=document.createElement('option');o.value=f[1];o.textContent=f[0];fs.appendChild(o)});var fsp=document.createElement('span');fl.appendChild(fs);fl.appendChild(fsp);panel.appendChild(fl);
if(saved.font){fs.value=saved.font;RT.setProperty('--font',saved.font)}
fs.addEventListener('change',function(){saved.font=fs.value;RT.setProperty('--font',fs.value);save()});
var rb=document.createElement('button');rb.type='button';rb.className='rst';panel.appendChild(rb);
rb.onclick=function(){saved={};save();ITEMS.forEach(function(it){it[4].value=it[3];if(it[0]=='hc'||it[0]=='he'){applyC(it[0],it[3])}else RT.removeProperty('--'+it[0])});RT.removeProperty('--font');fs.selectedIndex=0};
bs.onclick=function(){panel.hidden=!panel.hidden};
window.uiLabels=function(){var j=lang=='de'?1:2;ITEMS.forEach(function(it,i){rows[i].textContent=it[j]});fsp.textContent=lang=='de'?'Schriftart':'Carattere';rb.textContent=lang=='de'?'Zurücksetzen':'Ripristina';bs.textContent=lang=='de'?'🎨 Farben':'🎨 Colori'};
var init='it';try{init=localStorage.getItem('lang')||'it'}catch(e){}
setLang(init=='de'?'de':'it');
function p(n){return n<10?'0'+n:''+n}
function tick(){
  var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
  var ma=(m+s/60)*6,ha=((h%12)+m/60)*30;
  document.getElementById('mm').setAttribute('transform','rotate('+ma+' 200 200)');
  document.getElementById('ss').setAttribute('transform','rotate('+((s+d.getMilliseconds()/1000)*6)+' 200 200)');
  document.getElementById('hh').setAttribute('transform','rotate('+ha+' 200 200)');
  document.getElementById('dig').textContent=p(h)+':'+p(m);
  document.getElementById('sec').textContent=p(s);
  var dk=lang+d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
  if(dk!==window._dk){window._dk=dk;var Lg=L[lang];document.getElementById('dl1').textContent=Lg.tage[d.getDay()];document.getElementById('dr1').textContent=Lg.fmt(d.getDate(),Lg.mon[d.getMonth()],d.getFullYear());}
}
tick();setInterval(tick,50);
</script>
</body>
</html>

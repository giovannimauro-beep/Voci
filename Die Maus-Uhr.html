<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Die Maus-Uhr</title>
<style>
:root{--bg:#fff7d6;--dial:#ffffff;--ink:#1d1d2b;--accent:#e63946;--blue:#1d4ed8;--face:#ffd9a8;--box:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14142b;--dial:#262650;--ink:#f5f5ff;--accent:#ff6b78;--blue:#7aa2ff;--face:#ffd9a8;--box:#262650}}
:root[data-theme="dark"]{--bg:#14142b;--dial:#262650;--ink:#f5f5ff;--accent:#ff6b78;--blue:#7aa2ff;--face:#ffd9a8;--box:#262650}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#c2185b;color:#fff;font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;
display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;min-height:100vh}
svg{width:min(94vw,540px);height:auto;--ink:#1d1d2b;--dial:#fff}
.digital{background:#fff;color:#111;border:6px solid #111;border-radius:28px;padding:6px 28px;
font-size:clamp(64px,18vw,130px);font-weight:900;letter-spacing:4px;line-height:1.1}
.digital small{font-size:.4em;color:#111}
.lang{display:flex;gap:10px}
.lang button{font:inherit;font-size:clamp(20px,5vw,30px);font-weight:800;padding:8px 22px;border-radius:999px;border:4px solid #6d28d9;background:#fff;color:#6d28d9;cursor:pointer}
.lang button.on{background:#6d28d9;color:#fff}
</style>
</head>
<body>
<svg viewBox="-90 -90 580 580" role="img" aria-label="Orologio di Lucia Mauro">

  <g id="nums" fill="none" stroke="#6d28d9" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"></g>
  
  
  <circle cx="100" cy="226" r="15" fill="#ff9aa2" opacity=".8"/><circle cx="300" cy="226" r="15" fill="#ff9aa2" opacity=".8"/><path d="M124 114 Q150 94 176 114" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/><path d="M224 114 Q250 94 276 114" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/><ellipse cx="150" cy="150" rx="26" ry="30" fill="url(#sg)" stroke="var(--ink)" stroke-width="4"/><ellipse cx="250" cy="150" rx="26" ry="30" fill="url(#sg)" stroke="var(--ink)" stroke-width="4"/><circle cx="154" cy="156" r="12" fill="#1d1d2b"/><circle cx="246" cy="156" r="12" fill="#1d1d2b"/><circle cx="158" cy="151" r="4" fill="#fff"/><circle cx="250" cy="151" r="4" fill="#fff"/><circle cx="200" cy="200" r="24" fill="#e63946" stroke="#1d1d2b" stroke-width="3"/><circle cx="192" cy="192" r="6" fill="#fff" opacity=".7"/><path d="M125 252 Q200 290 275 252 Q200 350 125 252 Z" fill="#e63946" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
  
  
  
  
  
  <g id="hh" fill="#ffb3d9" stroke="#1d1d2b" stroke-width="3" stroke-linejoin="round"><path d="M200 232 Q191 220 196 206 L204 206 Q209 220 200 232 Z"/><polygon points="191,208 197,172 197,140 203,140 203,172 209,208"/><polygon points="200,146 206,156 200,166 194,156"/><path d="M200 86 Q213 104 209 120 L191 120 Q187 104 200 86 Z"/><circle cx="200" cy="130" r="11"/><circle cx="200" cy="130" r="5" fill="var(--dial)"/></g>
  <g id="mm" fill="#c2185b" stroke="#1d1d2b" stroke-width="3" stroke-linejoin="round"><path d="M200 238 Q191 222 196 207 L204 207 Q209 222 200 238 Z"/><polygon points="192,208 197,172 197,115 203,115 203,172 208,208"/><polygon points="200,132 207,145 200,158 193,145"/><path d="M200 34 Q212 62 208 96 L192 96 Q188 62 200 34 Z"/><circle cx="200" cy="106" r="9"/><circle cx="200" cy="106" r="4" fill="var(--dial)"/></g>

</svg>
<div class="digital"><span id="dig">00:00</span> <small id="sec">00</small></div>
<div class="lang"><button id="bIt" type="button">Italiano</button><button id="bDe" type="button">Deutsch</button></div>

<script>
var nums=document.getElementById('nums');
var V='#6d28d9',six='<path d="M18 5 C9 6 4 15 4 27"/><ellipse cx="12.5" cy="27" rx="7.5" ry="8.5" fill="'+V+'"/>';
var GL={'0':'<ellipse cx="12" cy="20" rx="8.5" ry="16" fill="'+V+'"/>','1':'<path d="M5 11 L14 4 L14 37"/>','2':'<path d="M4 11 C4 2 20 2 20 11 Z" fill="'+V+'"/><path d="M4 10 C4 2 20 2 20 10 C20 18 6 26 4 36 L21 36"/>','3':'<path d="M8 4 C16 1 20 5 20 10 C20 16 14 19 8 19 Z" fill="'+V+'"/><path d="M8 19 C16 19 21 22 21 28 C21 36 15 38 8 37 Z" fill="'+V+'"/><path d="M4 7 C7 2 20 2 20 10 C20 17 14 19 10 19 C15 19 21 21 21 28 C21 38 8 39 3 33"/>','4':'<polygon points="3,26 17,4 17,26" fill="'+V+'"/><path d="M17 37 L17 4 L3 26 L22 26"/>','5':'<path d="M7 18 C15 15 21 18 21 27 C21 36 14 38 7 36 Z" fill="'+V+'"/><path d="M20 4 L6 4 L5 19 C10 15 21 17 21 27 C21 37 8 39 3 33"/>','6':six,'7':'<path d="M3 5 L21 5 L10 37"/>','8':'<ellipse cx="12" cy="11" rx="6.5" ry="6.5" fill="'+V+'"/><ellipse cx="12" cy="28" rx="8" ry="8" fill="'+V+'"/>','9':'<g transform="rotate(180 12.5 21)">'+six+'</g>'};
for(var i=1;i<=12;i++){var a=i*30*Math.PI/180,t=document.createElementNS('http://www.w3.org/2000/svg','g');
var s=''+i,W=s.length*26-2,cx=200+Math.sin(a)*135,cy=200-Math.cos(a)*135,h='';for(var k=0;k<s.length;k++)h+='<g transform="translate('+(k*26)+' 0)">'+GL[s[k]]+'</g>';t.setAttribute('transform','translate('+cx+' '+cy+') scale(.8) translate('+(-W/2)+' -20)');t.innerHTML=h;nums.appendChild(t);}
var L={it:{tage:['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'],mon:['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'],t1:'Orologio di',t2:'Lucia Mauro',fmt:function(d,m,y){return d+' '+m+' '+y}},de:{tage:['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'],mon:['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],t1:'Uhr von',t2:'Lucia Mauro',fmt:function(d,m,y){return d+'. '+m+' '+y}}};var lang='it';
function setLang(l){lang=l;var Lg=L[l];document.getElementById('t1').textContent=Lg.t1;document.getElementById('t2').textContent=Lg.t2;document.documentElement.lang=l;document.getElementById('bIt').className=l=='it'?'on':'';document.getElementById('bDe').className=l=='de'?'on':'';try{localStorage.setItem('lang',l)}catch(e){}}
document.getElementById('bIt').onclick=function(){setLang('it')};
document.getElementById('bDe').onclick=function(){setLang('de')};
var init='it';try{init=localStorage.getItem('lang')||'it'}catch(e){}
setLang(init=='de'?'de':'it');
function p(n){return n<10?'0'+n:''+n}
function tick(){
  var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
  var ma=(m+s/60)*6,ha=((h%12)+m/60)*30;
  document.getElementById('mm').setAttribute('transform','rotate('+ma+' 200 200)');
  document.getElementById('ss').setAttribute('transform','rotate('+((s+d.getMilliseconds()/1000)*6)+' 200 200)');
  document.getElementById('hh').setAttribute('transform','rotate('+ha+' 200 200)');
  document.getElementById('dig').textContent=p(h)+':'+p(m);
  document.getElementById('sec').textContent=p(s);
  var dk=lang+d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
  if(dk!==window._dk){window._dk=dk;var Lg=L[lang];document.getElementById('dl1').textContent=Lg.tage[d.getDay()];document.getElementById('dr1').textContent=Lg.fmt(d.getDate(),Lg.mon[d.getMonth()],d.getFullYear());}
}
tick();setInterval(tick,50);
</script>

</html>

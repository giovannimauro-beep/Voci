.row select{font-size:18px;padding:8px;border-radius:12px;border:3px solid #bbb;max-width:170px}
.rst{font:inherit;font-size:18px;font-weight:700;padding:8px 16px;border-radius:12px;border:3px solid #6d28d9;background:#fff;color:#6d28d9;cursor:pointer}

.row input[type=range]{width:150px}
#petals circle.ov{fill:url(#pet);stroke:none}
.row input[type=checkbox]{width:44px;height:44px;accent-color:#6d28d9;cursor:pointer}
.row input[type=text]{font-size:18px;padding:8px;border:3px solid #bbb;border-radius:12px;width:170px;box-sizing:border-box}
svg path[stroke-width="40"]{stroke:var(--rim,#6d28d9)}
svg ellipse[fill="url(#sg)"]{fill:var(--eye,url(#sg))}
svg circle[r="24"][fill="#e63946"]{fill:var(--nose,#e63946)}
svg path[fill="#e63946"]{fill:var(--mouth,#e63946)}
svg circle[fill="#ff9aa2"]{fill:var(--cheek,#ff9aa2)}
svg > text{fill:var(--txt,#ffc2e0);font-family:var(--font,'Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif)}
.lang button{font:inherit;font-size:clamp(20px,5vw,30px);font-weight:800;padding:8px 22px;border-radius:999px;border:4px solid #6d28d9;background:#fff;color:#6d28d9;cursor:pointer}
.lang button.on{background:#6d28d9;color:#fff}
</style>

function p(n){return n<10?'0'+n:''+n}
function tick(){
  var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
  var ma=(m+s/60)*6,ha=((h%12)+m/60)*30;
  document.getElementById('mm').setAttribute('transform','rotate('+ma+' 200 200)');
  document.getElementById('ss').setAttribute('transform','rotate('+((s+d.getMilliseconds()/1000)*6)+' 200 200)');
  document.getElementById('hh').setAttribute('transform','rotate('+ha+' 200 200)');
  document.getElementById('dig').textContent=p(h)+':'+p(m);
  document.getElementById('sec').textContent=p(s);

}
